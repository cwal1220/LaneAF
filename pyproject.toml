[project]
name = "laneaf"
version = "0.1.0"
description = "LaneAF with uv-managed PyTorch tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "onnx>=1.18.0",
  "opencv-python>=4.11.0.86",
  "pillow>=11.2.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.15.0",
  "tensorboard>=2.18.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
