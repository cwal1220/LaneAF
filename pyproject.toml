[project]
name = "laneaf"
version = "0.1.0"
description = "LaneAF with uv-managed modern PyTorch setup and Apple MPS support"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "opencv-python>=4.11.0.86",
  "pillow>=11.2.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.15.0",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[tool.uv]
package = false
